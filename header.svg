<svg viewBox="0 0 850 215" width="850" height="215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="100%" stop-color="#0a0a20" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="aurora-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="title-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Metamorphous&amp;family=Fira+Code:wght@400;600&amp;display=swap');
      .title-text {
        font-family: 'Metamorphous', 'Cinzel Decorative', 'Cinzel', 'Georgia', serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: 4px;
      }
      .sub-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 14px;
        letter-spacing: 1.5px;
      }
      .loc-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 12px;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect width="848" height="213" x="1" y="1" rx="18" fill="url(#card-bg)" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5" />
  <ellipse cx="120" cy="40" rx="160" ry="90" fill="url(#glow-blue)" filter="url(#aurora-blur)" />
  <ellipse cx="730" cy="170" rx="160" ry="90" fill="url(#glow-purple)" filter="url(#aurora-blur)" />

  <text x="425" y="100" text-anchor="middle" class="title-text" fill="url(#text-grad)" filter="url(#title-glow)">RIYEP-DEV</text>
  <text x="425" y="145" text-anchor="middle" class="sub-text" fill="#f0f0f5" fill-opacity="0.8">
    <tspan fill="#f0f0f5">Software Engineer</tspan>
    <tspan fill="#60a5fa"> &#10022; </tspan>
    <tspan fill="#f0f0f5">Network Engineer</tspan>
    <tspan fill="#60a5fa"> &#10022; </tspan>
    <tspan fill="#f0f0f5">IT Infrastructure</tspan>
  </text>
  <text x="425" y="178" text-anchor="middle" class="loc-text" fill="#f0f0f5" fill-opacity="0.45">
    Surabaya &#8226; Indonesia
  </text>
</svg>
