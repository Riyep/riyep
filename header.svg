<svg fill="none" viewBox="0 0 850 260" width="850" height="260" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Metamorphous&amp;family=Fira+Code:wght@400;600&amp;display=swap');
        .container {
          background: #050510;
          border: 1px solid rgba(96, 165, 250, 0.25);
          border-radius: 20px;
          height: 258px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
          box-shadow: 0 10px 40px -10px rgba(96, 165, 250, 0.2);
        }
        .glow-left {
          position: absolute;
          width: 320px;
          height: 220px;
          background: radial-gradient(circle, rgba(96, 165, 250, 0.35) 0%, transparent 70%);
          filter: blur(40px);
          top: -60px;
          left: -40px;
        }
        .glow-right {
          position: absolute;
          width: 320px;
          height: 220px;
          background: radial-gradient(circle, rgba(167, 139, 250, 0.3) 0%, transparent 70%);
          filter: blur(40px);
          bottom: -60px;
          right: -40px;
        }
        .title {
          font-family: 'Metamorphous', serif;
          font-size: 56px;
          font-weight: 900;
          background: linear-gradient(135deg, #ffffff 0%, #60a5fa 65%, #a78bfa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0;
          letter-spacing: 3px;
          z-index: 2;
          filter: drop-shadow(0 0 25px rgba(96, 165, 250, 0.4));
        }
        .subtitle {
          font-family: 'Fira Code', monospace;
          font-size: 14px;
          color: rgba(240, 240, 245, 0.75);
          margin-top: 14px;
          z-index: 2;
          letter-spacing: 1px;
        }
        .dot {
          color: #60a5fa;
          margin: 0 10px;
        }
        .location {
          font-family: 'Fira Code', monospace;
          font-size: 12px;
          color: rgba(240, 240, 245, 0.45);
          margin-top: 8px;
          z-index: 2;
        }
      </style>
      <div class="container">
        <div class="glow-left"></div>
        <div class="glow-right"></div>
        <h1 class="title">RIYEP-DEV</h1>
        <div class="subtitle">
          <span>Software Engineer</span>
          <span class="dot">✦</span>
          <span>Network Engineer</span>
          <span class="dot">✦</span>
          <span>IT Infrastructure</span>
        </div>
        <div class="location">Surabaya, Indonesia &bull; PT Saranabhakti Timur</div>
      </div>
    </div>
  </foreignObject>
</svg>
