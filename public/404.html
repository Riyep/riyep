<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Halaman Tidak Ditemukan | Riyep</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    /* Starry background grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(96, 165, 250, 0.12) 1px, transparent 1px),
        radial-gradient(rgba(167, 139, 250, 0.08) 1px, transparent 1px);
      background-size: 32px 32px, 64px 64px;
      background-position: 0 0, 16px 16px;
      pointer-events: none;
    }
    /* Ambient cosmic glows */
    .glow-cyan {
      position: absolute;
      top: -100px;
      left: -80px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .glow-purple {
      position: absolute;
      bottom: -100px;
      right: -80px;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.22) 0%, rgba(147, 51, 234, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Glass card container */
    .card {
      position: relative;
      z-index: 10;
      max-width: 580px;
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
      text-align: center;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(96, 165, 250, 0.35);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px rgba(96, 165, 250, 0.25);
      margin-bottom: 24px;
    }
    .logo-badge img {
      width: 44px;
      height: auto;
    }

    .status-tag {
      display: inline-block;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 18px;
    }

    .error-code {
      font-size: clamp(4.5rem, 14vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 20%, #93c5fd 60%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 30px rgba(96, 165, 250, 0.35));
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .countdown-box {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .countdown-num {
      color: #38bdf8;
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 20px;
      }
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>

  <div class="card">
    <div class="logo-badge">
      <img src="/logo.svg" alt="RYP Logo">
    </div>

    <div>
      <span class="status-tag">[ERR_PAGE_NOT_FOUND // 404]</span>
    </div>

    <h1 class="error-code">404</h1>
    <h2 class="error-title">Halaman Tidak Ditemukan</h2>
    <p class="error-desc">
      Halaman atau rute yang Anda tuju tidak tersedia atau telah dipindahkan. Sistem akan mengalihkan Anda ke beranda secara otomatis.
    </p>

    <div class="countdown-box">
      <span>Mengalihkan otomatis dalam</span>
      <span id="countdown" class="countdown-num">5</span>
      <span>detik...</span>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        &larr; Kembali ke Beranda
      </a>
      <a href="https://wa.me/6289677602300" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
        💬 Hubungi via WhatsApp
      </a>
    </div>
  </div>

  <script>
    (function() {
      var seconds = 5;
      var countdownEl = document.getElementById('countdown');
      var interval = setInterval(function() {
        seconds--;
        if (countdownEl) {
          countdownEl.textContent = seconds;
        }
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.replace('/');
        }
      }, 1000);
    })();
  </script>
</body>
</html>
